services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=20", "-c", "maintenance_work_mem=32MB"]
    mem_limit: 384m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    env_file:
      - .env

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 128m
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6
    restart: unless-stopped
    command: centrifugo --config=/centrifugo/config.json
    mem_limit: 128m
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_HTTP_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  django:
    build: ./backend
    image: messenger-backend:dev
    restart: unless-stopped
    command: ["django"]
    mem_limit: 320m
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/admin/login/"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./backend
    image: messenger-backend:dev
    restart: unless-stopped
    command: ["api"]
    mem_limit: 256m
    env_file:
      - .env
    environment:
      UVICORN_WORKERS: ${UVICORN_WORKERS:-1}
    volumes:
      - media_data:/app/media
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  celery:
    build: ./backend
    image: messenger-backend:dev
    restart: unless-stopped
    command: ["celery"]
    mem_limit: 256m
    env_file:
      - .env
    environment:
      CELERY_CONCURRENCY: ${CELERY_CONCURRENCY:-2}
    volumes:
      - media_data:/app/media
    depends_on:
      django:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "celery", "-A", "config", "inspect", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/media:ro
      - static_data:/static:ro
    depends_on:
      api:
        condition: service_healthy
      django:
        condition: service_healthy
      centrifugo:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
